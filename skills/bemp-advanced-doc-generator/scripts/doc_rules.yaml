# =====================================================================
# BEMP 文档生成器格式优化规则（YAML 配置化）
# ---------------------------------------------------------------------
# 用途：
#   1. 将 doc_formatter.py 中硬编码的"空章节关键词 / 表格样式 / 段
#      落缩进 / 章节填充规则"全部外置到本文件。
#   2. outline-design-generator.py / design-generator.py 可通过
#      `doc_formatter.load_doc_rules()` 加载本文件，无需修改源码即
#      可调整文档风格。
#
# 设计原则：
#   - 配置缺失/解析失败时，doc_formatter 使用内置 _DEFAULT_RULES 兜底
#   - 关键词中不出现任何银行名/业务名，仅描述通用文档骨架
#   - generator 名称为字符串占位，doc_formatter 负责按 type 路由到
#     对应的内置生成函数（_build_design_goal_text 等）
# =====================================================================

# ---------------------------------------------------------------------
# TOC 目录
# ---------------------------------------------------------------------
toc:
  levels: "1-3"            # TOC 域的层级范围，注入到 Word 域代码中
  title_size_pt: 14        # 目录标题字号（标题 1 默认大小）
  indent_chars: 0          # 目录条目是否首行缩进（一般 0）
  placeholder_text: "请在 Word 中按 F9 或右键更新域以生成目录"

# ---------------------------------------------------------------------
# 空章节关键词：标题文本包含/等于下列关键词时，若章节内为空则
# 插入 placeholder 占位段落。
# ---------------------------------------------------------------------
empty_chapter_keywords:
  - "设计目标"
  - "设计原则"
  - "输入项"
  - "输出项"
  - "代码示例"
  - "性能优化"
  - "附录"
  - "错误码"
  - "模块复用分析"
  - "组件内部的模块列表及说明"
  - "API 接口清单"
  - "备注"
  - "模块划分"
  - "设计约束"
  - "外部接口"
  - "术语和缩写"
  - "术语定义"
  - "参考资料"
  - "参考文档"

# ---------------------------------------------------------------------
# 章节内容自动填充规则
# ---------------------------------------------------------------------
# 字段说明：
#   - keywords: 标题匹配关键词（任一命中即可）
#   - type:     生成内容类型，可选 text / table / uml_placeholder /
#               component_renumber / component_specific
#   - generator: doc_formatter 内部函数名（约定前缀 _build_/_
#                renumber_/etc.），按 type 路由时由 doc_formatter 解析
fill_chapters:
  概要设计:
    - keywords: ["设计目标", "设计原则"]
      type: "text"
      generator: "_build_design_goal_text"
    - keywords: ["术语和缩写", "术语定义"]
      type: "table"
      generator: "_build_glossary_data"
    - keywords: ["参考资料", "参考文献", "参考文档"]
      type: "table"
      generator: "_build_references_table"
    - keywords: ["类图", "顺序图", "活动图", "状态图"]
      type: "uml_placeholder"
      generator: "_build_uml_placeholder"
  详细设计:
    - keywords: ["概述", "项目概述", "系统概述"]
      type: "text"
      generator: "_build_overview_text"
    - keywords: ["系统组件", "组件结构图"]
      type: "component_renumber"
      generator: "_renumber_components"
    - keywords: ["关键技术"]
      type: "component_specific"
      generator: "_build_component_specific_tech"

# ---------------------------------------------------------------------
# 表格样式规则
# ---------------------------------------------------------------------
table_style:
  font_name: "宋体"
  font_size_pt: 10.5
  header_bold: true
  border: "Table Grid"     # 表格内置样式名，兜底值
  align: "left"            # 单元格内文字对齐
  header_fill: "D9D9D9"    # 表头底色（HEX 灰）
  border_color: "000000"
  border_size_eighths: 4   # w:sz 单位为 1/8 pt

# ---------------------------------------------------------------------
# 段落格式
# ---------------------------------------------------------------------
paragraph:
  first_line_indent_chars: 2
  font_name: "宋体"
  font_size_pt: 12
  line_spacing: 1.5
  apply_to_body: true
  skip_headings: true
  skip_tables: true

# ---------------------------------------------------------------------
# 章节内容归属修正（防止窜行）
# 典型场景：模板中"范围说明"误位于"设计目标"前，导致内容被认领
# 到错误章节。这里通过 source/target 关键词配对，把错放的内容移回
# 正确章节。
# ---------------------------------------------------------------------
chapter_content_correction:
  - source_keywords: ["范围说明"]
    target_keywords: ["设计目标"]
    type: "move_table"
  - source_keywords: ["术语和缩写", "术语定义"]
    target_keywords: ["参考资料"]
    type: "move_table"

# ---------------------------------------------------------------------
# 标题编号规则（增强配置已合并到 370 行附近的 heading_numbering 节点）
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# 设计约束无关段落过滤
# ---------------------------------------------------------------------
# 在"设计约束"章节下，与 business_keywords（由调用方注入）无关的
# 段落会被删除。generic_terms 视为业务相关，保留。
design_constraint:
  enable: true
  generic_terms:
    - "设计目标"
    - "设计原则"
    - "设计约束"
    - "非功能性"
    - "可用性"
    - "可靠性"
    - "安全性"
    - "可维护性"
    - "可扩展性"

# ---------------------------------------------------------------------
# UI 段落软换行
# ---------------------------------------------------------------------
ui_paragraph:
  enable: true
  max_chars_per_line: 40

# ---------------------------------------------------------------------
# 占位符文本
# ---------------------------------------------------------------------
placeholder:
  empty_chapter: "不涉及"
  ui_soft_break_keep: "（保持换行展示）"

# ---------------------------------------------------------------------
# 蓝色超链接/占位文字清理
# ---------------------------------------------------------------------
blue_runs:
  enable: true
  preserve_hyperlinks: true
  preserve_underline_runs: true

# ---------------------------------------------------------------------
# 示例内容识别与清除规则
# ---------------------------------------------------------------------
# 模板中常有"示例内容"用于说明填写方式，这些内容需在填充前清除。
# 调用 doc_formatter.clear_example_content() 时使用以下规则。
example_content:
  enable: true
  # 示例前缀：段落以这些前缀开头时，视为示例内容
  prefixes:
    - "示例："
    - "样例："
    - "例如："
    - "举例："
    - "说明："
    - "注："
    - "备注："
    - "注意："
    - "提示："
    - "※"
    - "★"
  # 整行匹配关键词：段落包含这些关键词时，视为示例内容整段删除
  whole_line_keywords:
    - "以下为示例"
    - "以下为样例"
    - "示例内容"
    - "样例内容"
    - "请根据实际情况"
    - "请根据实际需求"
    - "请修改为实际"
    - "请替换为实际"
    - "此处填写"
    - "此处填入"
    - "请在此处"
    - "模板内容"
    - "占位内容"
    - "以下内容仅供参考"
    - "实际内容请根据"
    - "请自行补充"
  # 占位符模式：段落包含这些模式时，清除段落内容
  placeholder_patterns:
    - "【请填写"
    - "【请补充"
    - "【待填写"
    - "【待补充"
    - "XXX"
    - "YYY"
    - "ZZZ"
    - "{{"
    - "<<"
  # 是否启用浅色文字检测（激进模式，默认关闭）
  aggressive_light_color: false
  # 浅色文字阈值（RGB各分量 > 阈值视为浅色说明文字）
  light_color_threshold: 128

# ---------------------------------------------------------------------
# 模板备注清理规则
# ---------------------------------------------------------------------
# 模板中常有"模板说明/填写指南"等备注段落，调用 clean_template_remarks()
# 时根据以下关键词识别并清除。
template_remarks:
  enable: true
  keywords:
    - "模板说明"
    - "模板备注"
    - "填写说明"
    - "填写指南"
    - "请根据实际情况"
    - "请根据项目实际"
    - "请替换为"
    - "以下为示例"
    - "以下内容仅"
    - "本模板"
    - "说明：以下"
    - "备注：以下"
  # 标题中的括号备注清理（如"（请填写项目名称）"）
  heading_bracket_cleanup: true

# ---------------------------------------------------------------------
# 模板清理流程配置
# ---------------------------------------------------------------------
# 定义 full_template_cleanup() 的执行顺序和参数
template_cleanup:
  enable: true
  # 阶段1：蓝色文本清理
  blue_enhanced: true
  # 阶段2：示例内容清除
  example_clear: true
  # 阶段3：模板备注清除
  remarks_clean: true
  # 阶段4：图片后冗余文字清除（2026-06-06 新增）
  image_redundant_clear: true
  # 是否激进模式（清除浅色文字段落）
  aggressive: false

# ---------------------------------------------------------------------
# 图片后冗余文字检测（2026-06-06 新增）
# ---------------------------------------------------------------------
# 场景：模板在"类图/顺序图/活动图/架构图"等标题下，往往已写了
#   "图1 xxx"  /  "Figure 1"  /  "图 1：系统架构"  /  "（图1）" 等
# 占位说明，图片插入后这些文字仍残留，与自动插入的图说重复。
#
# 检测策略：
#   1) 文本"仅含图号"（如"图1"、"图 1"、"图1."）→ 删除整段
#   2) 文本"含图号 + 简短说明"且整段以图号开头 → 保留，但剥除前导图号
#   3) 文本"含图号 + 较长说明"（>= 12 字）→ 视为正式图说，保留
# 跨章节统一处理：扫描整个文档所有 w:drawing 后的非标题段落
image_redundant_text:
  enable: true
  # 触发清理的"图片元素"标识（OXML 标签名）
  drawing_tags:
    - "w:drawing"
    - "w:pict"
  # 段落距离图片的最大偏移（1=紧邻图片的下一段；2=下两段）
  max_offset_after: 1
  # 仅图号模式：整段仅含图号时整段删除
  figure_number_only_patterns:
    - "^\\s*图\\s*\\d+\\s*[:：]?\\s*$"
    - "^\\s*图\\s*\\d+\\s*\\.\\s*$"
    - "^\\s*Fig\\w*\\.?\\s*\\d+\\s*[:：]?\\s*$"
    - "^\\s*Figure\\s*\\d+\\s*[:：]?\\s*$"
    - "^\\s*表\\s*\\d+\\s*[:：]?\\s*$"
    - "^\\s*Table\\s*\\d+\\s*[:：]?\\s*$"
  # 复合图号模式：段落以图号开头但带有简短说明（< 说明阈值）→ 剥除前导图号
  # 2026-06-06 修正：去掉 ig 强制依赖；支持"图"/"表"/"Fig"/"Figure"/"Table"
  figure_with_caption_pattern: "^(\\s*(?:图\\s*|表\\s*|Fig\\.?\\s*|Figure\\s*|Table\\s*)\\d+\\s*[:：\\.、\\-]?\\s*)(.+)$"
  caption_description_min_length: 12
  # 标题级别的图说保护关键词：含这些词时一律视为正式图说，不清除
  # 2026-06-06 修正：移除"架构"等过宽关键词，避免误判"系统架构"等术语性内容
  protected_keywords:
    - "架构图"
    - "网络拓扑图"
    - "部署图"
    - "ER图"
    - "类图"
    - "顺序图"
    - "活动图"
    - "状态图"
    - "业务流程"
    - "时序图"
  # 标题图片清除后是否插入统一图说
  insert_caption_after_image: true
  default_caption_format: "{title}（自动生成）"

# ---------------------------------------------------------------------
# 标题编号规则（2026-06-06 重构）
# ---------------------------------------------------------------------
# 解决"子章节标题序号重复"与"序号定位错位"问题：
#   - level_format: 按级别定义编号格式
#     例：level_format: {1: "%d", 2: "%d.%d", 3: "%d.%d.%d"}
#   - skip_h1: 是否跳过 H1 编号
#   - separator: 多级编号分隔符
#   - start_at: 起始编号
#   - dedupe_existing: 是否去重已有编号（防止模板硬编码"4.1 4.2..."与
#                      实际章节位置不匹配时出现重复）
heading_numbering:
  enable: true
  skip_h1: false
  separator: "."
  start_at: 1
  # 级别编号格式：{级别: 格式串}；使用 Python str.format 占位
  level_format:
    1: "{n}"
    2: "{n1}.{n2}"
    3: "{n1}.{n2}.{n3}"
  # 是否去重：开启时若检测到模板硬编码的编号与新计算编号冲突，自动剥除旧编号
  dedupe_existing: true
  # 编号正则：用于识别并剥除段落开头已存在的编号
  # 解决 "5.1bm"、"5.1 bm"、"5、机构管理" 等格式问题
  # 顺序敏感：先命中先生效
  # 用反向断言避免"5.1"被误识别为"5."+"1"
  # (?!\d) 确保不吞并后续数字（"5.1bm"识别为"5.1"）
  number_prefix_patterns:
    - '^\s*\d+(?:\.\d+)+(?!\d)'
    - '^\s*\d+\s*[、．.）)\]](?!\.\d)(?!\d)'
    - '^\s*[\[【（(]\s*\d+\s*[\]】）)]\s*'
    - '^\s*第\s*\d+\s*[章节部分]\s*'
    - '^\s*[一二三四五六七八九十]+[、\.]\s*'
    - '^\s*\([一二三四五六七八九十0-9]+\)\s*'
  # 哪些标题层级需要重新编号
  apply_levels: [1, 2, 3]

  # 2026-06-07 增强：兜底文本（剥离前缀后为空时使用）
  fallback_h2_body: "子模块"
  fallback_h3_body: "子章节"

  # 2026-06-07 新增：空表格处理规则
  empty_table:
    enable: true
    target_keywords:
      - "组件汇总"
      - "组件汇总表"
      - "组件结构图"
      - "系统组件"
      - "外部接口"
      - "API 接口清单"
      - "术语和缩写"
      - "术语定义"
      - "参考资料"
      - "参考文档"
      - "错误码"
    placeholder: "不涉及"
    keep_titles: []

  # 2026-06-07 新增：ER 图插入位置
  er_diagram:
    insert_before_h1: "附录"
    new_h1_title: "数据库ER关系图"
    section_intro: "本章集中展示系统涉及的数据库实体关系图（ER图），用于直观呈现表结构及表间关系。"

# ---------------------------------------------------------------------
# 标题样式统一规则（2026-06-06 新增）
# ---------------------------------------------------------------------
# 解决"同一级标题字号/字体不一致"问题：
#   - 模板中"4.1功能描述"被识别为 Heading 2 样式，4.2"模块划分"被识别为
#     Normal 样式（外观不同）。本规则按段落位置智能推断标题级别并统一样式。
#   - 触发条件：段落文本命中"标准子节标题关键词"且当前样式不是 Heading N
#   - 应用：强制设置 pStyle 字段、设置字体大小、加粗
heading_style_unify:
  enable: true
  # H2 标准子节关键词（命中即视为 H2 标题）
  # 2026-06-07 调整：与 h3_keywords 去重——"关键算法""关键节点"等深度子节下移为 H3
  h2_keywords:
    - "功能描述"
    - "模块划分"
    - "接口边界"
    - "模块职责"
    - "输入项"
    - "输出项"
    - "功能定义"
    - "业务流程"
    - "业务规则"
    - "数据校验"
    - "异常处理"
    - "接口"
    - "类图"
    - "顺序图"
    - "时序图"
    - "活动图"
    - "状态图"
    - "界面"
    - "性能"
    - "备注"
    - "术语定义"
    - "开发环境"
    - "参考资料"
    - "目的"
    - "编写目的"
  # H1 标准标题关键词（命中即视为 H1 标题）
  h1_keywords:
    - "概述"
    - "项目概述"
    - "系统概述"
    - "设计约束"
    - "模块设计说明"
    - "附录"
    - "组件内部的模块列表及说明"
  # H3 标准子子节关键词（命中即视为 H3 标题）——2026-06-07 新增
  # 主要用于"模块N设计说明"章节下的技术深度子节（如"核心算法""代码示例""性能优化"）
  # 模板中常以 Normal/加粗呈现，未带 Heading 3 样式，需补齐
  # 2026-06-07 修正：移除 H1 直系子标题（业务背景/设计目标/范围说明/技术实现细节等），
  # 这些由 _fill_overview_h1 正确设为 H2，不应通过关键词降级。
  h3_keywords:
    - "核心算法"
    - "关键算法"
    - "算法说明"
    - "算法逻辑"
    - "代码示例"
    - "代码实现"
    - "代码片段"
    - "实现示例"
    - "性能优化"
    - "性能分析"
    - "性能指标"
    - "优化策略"
    - "关键节点"
  # 2026-06-07 新增：中文/英文章节前缀清理模式
  # 解决"第八章 技术实现细节""第1节 概述"等硬编码前缀与自动编号叠加
  # 与 numbering 的 number_prefix_patterns 互补：
  #   - 编号清理作用于 renumber 阶段（剥前缀后按层级重写）
  #   - 此处章节前缀清理作用于 unify 阶段（仅清理硬编码的中文/英文"第N章"等模式）
  chinese_chapter_prefix:
    enable: true
    # 命中后剥除的硬编码前缀（每个 pattern 独立 try，单个失败不影响其他）
    strip_patterns:
      - "第\\s*[一二三四五六七八九十0-9]+\\s*章\\s*"
      - "第\\s*[一二三四五六七八九十0-9]+\\s*节\\s*"
      - "第\\s*[一二三四五六七八九十0-9]+\\s*部分\\s*"
      - "Chapter\\s*\\d+\\s*"
      - "Section\\s*\\d+\\s*"
  # 2026-06-07 新增：自动提升子标题样式
  # 解决"子标题未设置带样式标题"问题——模板中 Normal/加粗的子标题升级为 Heading
  auto_promote:
    enable: true
    max_chars: 24             # 超过此长度的段落不视为子标题
    require_bold: false       # 不强制要求加粗（避免漏检：仅用大字号区分）
    min_size_pt: 11           # 字号≥此值视为子标题候选
    body_size_pt: 10.5        # 正文基准字号（仅供调试输出）
    keyword_match_required: true  # 强制要求命中 H1/H2/H3 关键词，避免误判
  # 各级标题的字体大小（单位：pt）
  h1_size_pt: 16
  h2_size_pt: 14
  h3_size_pt: 12
  # 各级标题是否加粗
  h1_bold: true
  h2_bold: true
  h3_bold: true
  # 各级标题字体名
  font_name: "黑体"

# ---------------------------------------------------------------------
# 功能模块表格内容映射规则（2026-06-06 重构）
# ---------------------------------------------------------------------
# 解决表格内容与业务模块无关、混入技术实现细节的问题：
#   - 业务列：仅保留与业务模块直接相关的字段
#   - 禁止列：含以下关键词的列会被剔除
#   - 行内容清洗：移除含技术实现细节关键词的行
function_module_table:
  enable: true
  # 标准表头（按业务相关性排序）
  standard_headers:
    - "序号"
    - "模块名称"
    - "功能说明"
    - "业务规则"
    - "输入数据"
    - "输出数据"
  # 表格头部关键词（命中其一则视为功能模块表）
  table_title_keywords:
    - "功能模块"
    - "业务模块"
    - "模块清单"
    - "模块列表"
    - "组件清单"
    - "组件列表"
    - "功能子模块"
    - "模块汇总"
  # 禁止出现的列名关键词（命中则剔除该列）
  forbidden_column_keywords:
    - "技术实现"
    - "技术方案"
    - "实现方式"
    - "代码路径"
    - "类名"
    - "方法名"
    - "调用接口"
    - "依赖"
    - "框架"
    - "Spring"
    - "Dubbo"
    - "MyBatis"
    - "Mapper"
    - "Service"
    - "Dao"
  # 禁止出现的行内容关键词（命中则剔除该行）
  forbidden_row_keywords:
    - "注入"
    - "@Resource"
    - "@Autowired"
    - "@Component"
    - "redisTemplate"
    - "SQL"
    - "select"
    - "update"
    - "where"
    - "trxCode"
    - "interface"
    - "extends"
    - "implements"
  # 行兜底：禁止行剔除后为空时使用
  fallback_row_text: "本模块提供核心业务功能处理能力"
  # 自动从业务子模块生成行
  auto_generate_from_subsystems: true

# =====================================================================
# 2026-06-07 增强（v7.1）：硬编码外置为配置
# ---------------------------------------------------------------------
# 本节集中收纳代码层（outline-design-generator.py / lib/*.js）
# 散落的所有硬编码参数，原则：
#   1. 业务无关：仅描述"通用文档骨架 + 通用图表生成策略"
#   2. 关键词驱动：标题匹配、文件命名匹配均使用关键词集合
#   3. 缺失兜底：配置不存在时 doc_formatter / generator 用内置
#      _DEFAULT_RULES 兜底，绝不抛 KeyError
# =====================================================================

# ---------------------------------------------------------------------
# UML 图表配置
# ---------------------------------------------------------------------
# 控制 UML 图（类图/顺序图/活动图等）的标题识别、文件查找、
# 占位文字、引擎选择。所有硬编码的"UML_DIAGRAM_KEYWORDS"等数组
# 全部迁移至此。
uml:
  enable: true
  # 章节标题识别关键词（按 H2/H3 文本包含判定）
  keywords:
    - "类图"
    - "顺序图"
    - "活动图"
    - "状态图"
    - "组件图"
    - "时序图"
    - "协作图"
    - "部署图"
  # 必填章节：模板缺失时自动创建 H2 + 占位段
  required_headings:
    - "类图"
    - "顺序图"
    - "活动图"
  # 图类型优先级：插入章节时按此顺序匹配 diagrams 目录
  diagram_type_priority:
    - "类图"
    - "顺序图"
    - "活动图"
    - "状态图"
  # 文件名匹配规则：按图类型从 diagrams 目录匹配 PNG
  # 顺序敏感：先匹配先返回，支持 glob 通配符（*.png）
  file_matchers:
    类图:
      - "class-diagram.png"
      - "uml-类图.png"
      - "uml-类.png"
    顺序图:
      - "sequence-*.png"
      - "uml-顺序图.png"
      - "uml-顺序.png"
    活动图:
      - "activity-*.png"
      - "uml-活动图.png"
      - "uml-活动.png"
    状态图:
      - "state-*.png"
      - "uml-状态图.png"
      - "uml-状态.png"
    组件图:
      - "component-*.png"
      - "uml-组件图.png"
      - "uml-组件.png"
  # 占位段清理关键词：含这些词的整段会被删除（图插入后清理）
  placeholder_cleaners:
    - "类图待补充"
    - "顺序图待补充"
    - "活动图待补充"
    - "状态图待补充"
    - "组件图待补充"
    - "建议使用工具"
    - "请在详细设计阶段补充"
    - "建议在详细设计阶段"
  # 兜底占位文字模板（找不到 PNG 时插入）
  # 可用占位符：{diagram_name}、{diagram_type}
  fallback_placeholder_template: "【{diagram_name}待补充】\n建议在详细设计阶段使用 Visio / draw.io / Mermaid 等工具补充专业的{diagram_name}。"
  # 图表最小尺寸（KB），小于此值视为生成失败
  min_diagram_size_kb: 10
  # 是否启用兜底图表生成（无业务实体时仍生成基础类图）
  fallback_generation: true
  # 兜底类图模板：含 Controller/Service/Repository/Entity/DTO 基础类
  fallback_class_diagram:
    classes:
      - { name: "Controller", stereotype: "control" }
      - { name: "Service", stereotype: "service" }
      - { name: "Repository", stereotype: "dataAccess" }
      - { name: "Entity", stereotype: "entity" }
      - { name: "DTO", stereotype: "data" }
    relations:
      - { from: "Controller", to: "Service", label: "调用" }
      - { from: "Service", to: "Repository", label: "使用" }
      - { from: "Service", to: "DTO", label: "转换" }
      - { from: "Repository", to: "Entity", label: "操作" }
    title: "业务实体类图"
  # 兜底顺序图模板：登录鉴权流程
  fallback_sequence_diagram:
    actors: ["用户", "前端", "后端服务", "认证中心", "数据库"]
    messages:
      - { from: "用户", to: "前端", label: "输入凭证" }
      - { from: "前端", to: "后端服务", label: "登录请求" }
      - { from: "后端服务", to: "认证中心", label: "身份验证" }
      - { from: "认证中心", to: "数据库", label: "查询用户" }
      - { from: "数据库", to: "认证中心", label: "返回用户信息" }
      - { from: "认证中心", to: "后端服务", label: "返回Token" }
      - { from: "后端服务", to: "前端", label: "返回Token" }
      - { from: "前端", to: "用户", label: "跳转主页" }
    title: "登录鉴权顺序图"
  # 兜底活动图模板：业务处理流程
  fallback_activity_diagram:
    nodes:
      - { id: "start", shape: "circle", label: "开始" }
      - { id: "req", shape: "box", label: "接收请求" }
      - { id: "validate", shape: "diamond", label: "参数校验" }
      - { id: "business", shape: "box", label: "业务处理" }
      - { id: "persist", shape: "box", label: "持久化" }
      - { id: "end", shape: "circle", label: "结束" }
    edges:
      - { from: "start", to: "req" }
      - { from: "req", to: "validate" }
      - { from: "validate", to: "business", label: "通过" }
      - { from: "validate", to: "end", label: "失败" }
      - { from: "business", to: "persist" }
      - { from: "persist", to: "end" }
    title: "业务处理流程活动图"

# ---------------------------------------------------------------------
# 标题编号规范化（增强版）
# ---------------------------------------------------------------------
# 控制"5.1bm"等脏前缀的清理、统一编号格式；与原
# heading_numbering 节互补，本节定义"清理逻辑细节"。
title_normalize:
  enable: true
  # 标题样式 ID 集合（不同模板/语言下 Heading 样式 ID 不一致）
  heading_style_ids:
    - "1"
    - "2"
    - "3"
    - "Heading1"
    - "Heading2"
    - "Heading3"
    - "heading1"
    - "heading2"
    - "heading3"
    - "heading 1"
    - "heading 2"
    - "heading 3"
  # 编号格式正则
  number_pattern: "^(\\d+(\\.\\d+)*)[\\s.、，,：:]*"
  # 文本清理正则（剥离脏前缀）——顺序敏感
  text_strip_patterns:
    - "^(\\d+\\.\\d+)\\D+"     # 5.1bm → 5.1 bm
    - "^(\\d+)、\\s*"          # 一、xxx
    - "^\\([一二三四五六七八九十0-9]+\\)\\s*"
  # 兜底正文（剥离后为空时使用）
  fallback_h2_body: "子模块"
  fallback_h3_body: "子章节"
  # 是否禁用样式表继承的自动编号
  override_inherited_numbering: true
  # 是否清理模板样式表中的 numPr 定义
  strip_style_numbering: true

# ---------------------------------------------------------------------
# 空表格处理（增强版）
# ---------------------------------------------------------------------
# 与 heading_numbering.empty_table 互补：本节定义"内容生成"层面的
# 兜底填充策略，原有节定义"删除/保留"策略。
empty_table:
  enable: true
  # 触发删除的标题关键词（不区分大小写）
  delete_if:
    - "组件列表"
    - "接口定义"
    - "字段说明"
    - "不涉及"
  # 触发填充的标题关键词 + 填充模板
  fill_if:
    功能说明: "本模块实现{module_name}的核心业务功能，涵盖关键子功能，支持 {integration} 等集成方式。"
    业务规则: "1. 业务规则一：{rule_1}\n2. 业务规则二：{rule_2}\n3. 业务规则三：{rule_3}"
    输入项: "本模块的输入项包括业务参数、交易上下文、用户身份信息等，具体参见接口文档。"
    输出项: "本模块的输出项包括业务处理结果、状态码、错误信息等。"
  # 默认占位文字
  default_placeholder: "（不涉及）"
  # 是否启用双层检测（段落文本 + 表格内容）
  dual_layer_check: true

# ---------------------------------------------------------------------
# ER 图插入位置（增强版）
# ---------------------------------------------------------------------
# 与 heading_numbering.er_diagram 互补：本节定义通用 ER 图
# 插入的完整流程（位置 / 章节标题 / 引用关系）。
er_diagram_migration:
  enable: true
  # 触发迁移的源章节标题
  source_heading: "适用范围"
  # 目标 H1 章节（新建）
  target_h1: "数据库ER关系图"
  # 目标 H2 前缀
  h2_prefix: "ER"
  # 分组总数上限
  max_groups: 35
  # "其他"分组占比上限（超过则触发二次分组）
  max_other_ratio: 0.3
  # 单组表数上限
  max_tables_per_group: 50
  # 章节前言模板
  section_intro: "本章集中展示系统涉及的数据库实体关系图（ER图），用于直观呈现表结构及表间关系。"
  # ER 图文件命名模式（{group_name} 占位）
  file_naming_pattern: "ER_{group_name}.png"

# ---------------------------------------------------------------------
# 关键技术差异化配置
# ---------------------------------------------------------------------
# 控制"关键技术"章节如何为每个组件生成差异化描述，避免内容重复。
tech_description:
  enable: true
  # 业务模块类型关键词（按命中优先级排序）
  type_keywords:
    query: ["查询", "检索", "浏览", "列表", "详情", "统计", "报表"]
    write: ["新增", "修改", "删除", "保存", "提交", "编辑", "录入"]
    batch: ["批量", "导入", "导出", "同步", "迁移", "上载", "下发"]
    approval: ["审批", "审核", "流程", "复核", "签批", "授权"]
    integration: ["对接", "接入", "集成", "外部", "三方", "前置", "网关"]
  # 每模块技术子集大小（最小-最大）
  subset_size: [5, 7]
  # 集成方式变体（按 hash 循环选择）
  integration_variants:
    - "通过Feign远程调用{bank_name}前置服务"
    - "通过Dubbo RPC调用{bank_name}核心服务"
    - "通过Kafka消息队列异步通知{bank_name}"
    - "通过HTTP+JSON接口调用{bank_name}外围系统"
    - "通过SOAP WS调用{bank_name}企业服务总线"
  # 兜底技术栈（hash 未命中时使用）
  fallback_tech_stack:
    - "Spring Boot"
    - "MyBatis"
    - "Redis"
    - "MySQL"
    - "ZooKeeper"
    - "Logback"
    - "Swagger"
  # 模板：标题
  title_template: "{module_name}关键技术"
  # 模板：技术子项
  tech_item_template: "{name}：{role}"

# ---------------------------------------------------------------------
# 图表生成引擎配置
# ---------------------------------------------------------------------
# 控制图表生成引擎的选择、降级、超时等
chart_engine:
  enable: true
  # 引擎选择优先级（按顺序尝试）
  engine_priority:
    - "antv"
    - "matplotlib"
  # UML 引擎
  uml_engine: "graphviz"
  # 引擎不可用时的降级策略：reuse_then_placeholder / placeholder_only / fail
  fallback_strategy: "reuse_then_placeholder"
  # AntV MCP 不可用时的等待超时（毫秒）
  antv_timeout_ms: 60000
  # 最小图表尺寸（KB），小于此值视为生成失败
  min_diagram_size_kb: 10
  # 是否启用并行生成
  parallel: true
  # Graphviz dot 命令名
  graphviz_dot_cmd: "dot"
  # 图表输出目录
  output_dir: "output/diagrams"
  # 兜底占位文字模板
  fallback_message: "【图表待补充】\n当前环境缺少图表生成工具（AntV / Graphviz / matplotlib），请手动补充。"


# =====================================================================
# BEMP 文档生成器格式优化规则（YAML 配置化）
# ---------------------------------------------------------------------
# 用途：
#   1. 将 doc_formatter.py 中硬编码的"空章节关键词 / 表格样式 / 段
#      落缩进 / 章节填充规则"全部外置到本文件。
#   2. outline-design-generator.py / design-generator.py 可通过
#      `doc_formatter.load_doc_rules()` 加载本文件，无需修改源码即
#      可调整文档风格。
#
# 设计原则：
#   - 配置缺失/解析失败时，doc_formatter 使用内置 _DEFAULT_RULES 兜底
#   - 关键词中不出现任何银行名/业务名，仅描述通用文档骨架
#   - generator 名称为字符串占位，doc_formatter 负责按 type 路由到
#     对应的内置生成函数（_build_design_goal_text 等）
# =====================================================================

# ---------------------------------------------------------------------
# TOC 目录
# ---------------------------------------------------------------------
toc:
  levels: "1-3"            # TOC 域的层级范围，注入到 Word 域代码中
  title_size_pt: 14        # 目录标题字号（标题 1 默认大小）
  indent_chars: 0          # 目录条目是否首行缩进（一般 0）
  placeholder_text: "请在 Word 中按 F9 或右键更新域以生成目录"

# ---------------------------------------------------------------------
# 空章节关键词：标题文本包含/等于下列关键词时，若章节内为空则
# 插入 placeholder 占位段落。
# ---------------------------------------------------------------------
empty_chapter_keywords:
  - "设计目标"
  - "设计原则"
  - "输入项"
  - "输出项"
  - "代码示例"
  - "性能优化"
  - "附录"
  - "错误码"
  - "模块复用分析"
  - "组件内部的模块列表及说明"
  - "API 接口清单"
  - "备注"
  - "模块划分"
  - "设计约束"
  - "外部接口"
  - "术语和缩写"
  - "术语定义"
  - "参考资料"
  - "参考文档"

# ---------------------------------------------------------------------
# 章节内容自动填充规则
# ---------------------------------------------------------------------
# 字段说明：
#   - keywords: 标题匹配关键词（任一命中即可）
#   - type:     生成内容类型，可选 text / table / uml_placeholder /
#               component_renumber / component_specific
#   - generator: doc_formatter 内部函数名（约定前缀 _build_/_
#                renumber_/etc.），按 type 路由时由 doc_formatter 解析
fill_chapters:
  概要设计:
    - keywords: ["设计目标", "设计原则"]
      type: "text"
      generator: "_build_design_goal_text"
    - keywords: ["术语和缩写", "术语定义"]
      type: "table"
      generator: "_build_glossary_data"
    - keywords: ["参考资料", "参考文献", "参考文档"]
      type: "table"
      generator: "_build_references_table"
    - keywords: ["类图", "顺序图", "活动图", "状态图"]
      type: "uml_placeholder"
      generator: "_build_uml_placeholder"
  详细设计:
    - keywords: ["概述", "项目概述", "系统概述"]
      type: "text"
      generator: "_build_overview_text"
    - keywords: ["系统组件", "组件结构图"]
      type: "component_renumber"
      generator: "_renumber_components"
    - keywords: ["关键技术"]
      type: "component_specific"
      generator: "_build_component_specific_tech"

# ---------------------------------------------------------------------
# 表格样式规则
# ---------------------------------------------------------------------
table_style:
  font_name: "宋体"
  font_size_pt: 10.5
  header_bold: true
  border: "Table Grid"     # 表格内置样式名，兜底值
  align: "left"            # 单元格内文字对齐
  header_fill: "D9D9D9"    # 表头底色（HEX 灰）
  border_color: "000000"
  border_size_eighths: 4   # w:sz 单位为 1/8 pt

# ---------------------------------------------------------------------
# 段落格式
# ---------------------------------------------------------------------
paragraph:
  first_line_indent_chars: 2
  font_name: "宋体"
  font_size_pt: 12
  line_spacing: 1.5
  apply_to_body: true
  skip_headings: true
  skip_tables: true

# ---------------------------------------------------------------------
# 章节内容归属修正（防止窜行）
# 典型场景：模板中"范围说明"误位于"设计目标"前，导致内容被认领
# 到错误章节。这里通过 source/target 关键词配对，把错放的内容移回
# 正确章节。
# ---------------------------------------------------------------------
chapter_content_correction:
  - source_keywords: ["范围说明"]
    target_keywords: ["设计目标"]
    type: "move_table"
  - source_keywords: ["术语和缩写", "术语定义"]
    target_keywords: ["参考资料"]
    type: "move_table"

# ---------------------------------------------------------------------
# 标题编号规则
# ---------------------------------------------------------------------
heading_numbering:
  skip_h1: false
  separator: "."
  start_at: 1

# ---------------------------------------------------------------------
# 设计约束无关段落过滤
# ---------------------------------------------------------------------
# 在"设计约束"章节下，与 business_keywords（由调用方注入）无关的
# 段落会被删除。generic_terms 视为业务相关，保留。
design_constraint:
  enable: true
  generic_terms:
    - "设计目标"
    - "设计原则"
    - "设计约束"
    - "非功能性"
    - "可用性"
    - "可靠性"
    - "安全性"
    - "可维护性"
    - "可扩展性"

# ---------------------------------------------------------------------
# UI 段落软换行
# ---------------------------------------------------------------------
ui_paragraph:
  enable: true
  max_chars_per_line: 40

# ---------------------------------------------------------------------
# 占位符文本
# ---------------------------------------------------------------------
placeholder:
  empty_chapter: "不涉及"
  ui_soft_break_keep: "（保持换行展示）"

# ---------------------------------------------------------------------
# 蓝色超链接/占位文字清理
# ---------------------------------------------------------------------
blue_runs:
  enable: true
  preserve_hyperlinks: true
  preserve_underline_runs: true

# ---------------------------------------------------------------------
# 示例内容识别与清除规则
# ---------------------------------------------------------------------
# 模板中常有"示例内容"用于说明填写方式，这些内容需在填充前清除。
# 调用 doc_formatter.clear_example_content() 时使用以下规则。
example_content:
  enable: true
  # 示例前缀：段落以这些前缀开头时，视为示例内容
  prefixes:
    - "示例："
    - "样例："
    - "例如："
    - "举例："
    - "说明："
    - "注："
    - "备注："
    - "注意："
    - "提示："
    - "※"
    - "★"
  # 整行匹配关键词：段落包含这些关键词时，视为示例内容整段删除
  whole_line_keywords:
    - "以下为示例"
    - "以下为样例"
    - "示例内容"
    - "样例内容"
    - "请根据实际情况"
    - "请根据实际需求"
    - "请修改为实际"
    - "请替换为实际"
    - "此处填写"
    - "此处填入"
    - "请在此处"
    - "模板内容"
    - "占位内容"
    - "以下内容仅供参考"
    - "实际内容请根据"
    - "请自行补充"
  # 占位符模式：段落包含这些模式时，清除段落内容
  placeholder_patterns:
    - "【请填写"
    - "【请补充"
    - "【待填写"
    - "【待补充"
    - "XXX"
    - "YYY"
    - "ZZZ"
    - "{{"
    - "<<"
  # 是否启用浅色文字检测（激进模式，默认关闭）
  aggressive_light_color: false
  # 浅色文字阈值（RGB各分量 > 阈值视为浅色说明文字）
  light_color_threshold: 128

# ---------------------------------------------------------------------
# 模板备注清理规则
# ---------------------------------------------------------------------
# 模板中常有"模板说明/填写指南"等备注段落，调用 clean_template_remarks()
# 时根据以下关键词识别并清除。
template_remarks:
  enable: true
  keywords:
    - "模板说明"
    - "模板备注"
    - "填写说明"
    - "填写指南"
    - "请根据实际情况"
    - "请根据项目实际"
    - "请替换为"
    - "以下为示例"
    - "以下内容仅"
    - "本模板"
    - "说明：以下"
    - "备注：以下"
  # 标题中的括号备注清理（如"（请填写项目名称）"）
  heading_bracket_cleanup: true

# ---------------------------------------------------------------------
# 模板清理流程配置
# ---------------------------------------------------------------------
# 定义 full_template_cleanup() 的执行顺序和参数
template_cleanup:
  enable: true
  # 阶段1：蓝色文本清理
  blue_enhanced: true
  # 阶段2：示例内容清除
  example_clear: true
  # 阶段3：模板备注清除
  remarks_clean: true
  # 是否激进模式（清除浅色文字段落）
  aggressive: false

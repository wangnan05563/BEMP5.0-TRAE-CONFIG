# =====================================================================
# BEMP 详细设计文档生成管线配置 v1.0 — 2026-06-07
# =====================================================================
# 设计原则：
#   - 零硬编码：所有阈值/关键词/降级策略均通过本文件管理
#   - 通用化：不包含特定银行/项目名称，仅描述抽象规则
#   - 可扩展：新增管线阶段只需在 stages 中添加条目
#   - 兜底安全：配置缺失时各模块使用内置 _DEFAULT 值
# =====================================================================

# ---------------------------------------------------------------------
# 管线阶段顺序
# ---------------------------------------------------------------------
pipeline:
  enabled: true
  stages:
    - id: "data-prep"
      name: "数据准备"
      description: "解析需求MD → design_data JSON"
      required: true
      timeout_ms: 30000
    - id: "template-prep"
      name: "模板预处理"
      description: "复制模板 + 封面替换 + 蓝色清理"
      required: true
    - id: "chapter-fill"
      name: "章节填充"
      description: "按优先级策略填充模板章节"
      required: false  # preserve_mode 时跳过
      skip_when_preserve: true
    - id: "post-process"
      name: "后处理"
      description: "修订记录/标题编号/样式统一"
      required: true
    - id: "diagram-gen"
      name: "图表生成"
      description: "类图/顺序图/活动图/流程图/时序图 PNG 生成"
      required: false
      skip_when_preserve: false  # 保留模式也执行
    - id: "appendix-clean"
      name: "附录清理"
      description: "移除不协调的附录内容"
      required: false
      skip_when_preserve: false
    - id: "save-inject"
      name: "保存并注入"
      description: "doc.save + inject_update_fields"
      required: true

# ---------------------------------------------------------------------
# 保留模式 (Preserve Mode)
# 当 design_data.chapters 为空时触发，仅替换封面字段，保留模板原始正文
# ---------------------------------------------------------------------
preserve_mode:
  # 触发条件（支持多条件组合，任一满足即触发）
  triggers:
    - condition: "chapters_empty"
      description: "design_data.chapters 为空数组或不存在"
  # 保留模式中仍然执行的操作（白名单）
  allowed_operations:
    - "cover_page_replace"      # 封面标题/部门/日期替换
    - "revision_table_update"   # 修订记录表格更新
    - "heading_renumber"        # 标题编号重构
    - "heading_style_unify"     # 标题样式统一
    - "hardcode_number_strip"   # 硬编码编号剥除
    - "subheading_promote"      # 子标题样式提升
    - "diagram_generation"      # 图表自动生成
    - "appendix_cleanup"        # 附录清理
    - "body_indent"             # 正文缩进
    - "table_style"             # 表格样式统一
    - "toc_inject"              # TOC 域注入
  # 保留模式中跳过的操作（黑名单，优先级高于白名单）
  skipped_operations:
    - "blue_text_removal"       # 蓝色占位删除
    - "blue_run_clear"          # 蓝色 run 清理
    - "content_fill"            # 所有章节内容填充
    - "empty_chapter_fill"      # 空章节插入占位
    - "clear_between_headings"  # 标题间内容清理

# ---------------------------------------------------------------------
# 标题样式策略
# ---------------------------------------------------------------------
heading_strategy:
  # 核心原则：已设标题不升级/不降级
  # current_level > 0 的段落（已有 Heading 样式）仅应用视觉属性
  protected_heading_rule:
    enabled: true
    description: "已有 heading 样式的段落永不修改其 pStyle 级别"
    behavior: "only_visual"  # 仅改字号/加粗/字体，不改 pStyle
  # 仅对 Normal 段落（current_level == 0）按关键词推断并设置 Heading
  normal_promotion:
    enabled: true
    description: "Normal 段落命中关键词时升级为对应 Heading 样式"

# ---------------------------------------------------------------------
# 图表自动生成配置
# ---------------------------------------------------------------------
diagram_generation:
  enabled: true
  strategy: "graphviz_first"  # graphviz → matplotlib → placeholder
  registered_types:
    - keyword: "类图"
      file_prefix: "class-diagram"
      default_nodes: 3
    - keyword: "顺序图"
      file_prefix: "sequence-diagram"
      default_nodes: 3
    - keyword: "活动图"
      file_prefix: "activity-diagram"
      default_nodes: 5
    - keyword: "业务流程图"
      file_prefix: "business-flow"
      default_nodes: 4
    - keyword: "时序图"
      file_prefix: "timing-diagram"
      default_nodes: 4
  # 降级链
  fallback_chain:
    - backend: "graphviz"
      format: "png"
      timeout_ms: 10000
    - backend: "matplotlib"
      format: "png"
      timeout_ms: 15000
    - backend: "placeholder"
      format: "text"
      fallback_text: "（{diagram_type}详见UML设计文档，此处为占位说明）"
  image_settings:
    width_inches: 5.5
    dpi: 150
    caption_font_size_pt: 9
    caption_color: "808080"

# ---------------------------------------------------------------------
# 附录清理配置
# ---------------------------------------------------------------------
appendix_cleanup:
  enabled: true
  target: "附录F：术语与缩略语"
  # 需要在该附录下清理的内容模式（含匹配策略）
  removal_patterns:
    - pattern: "功能模块"
      match_type: "exact"       # exact/contains/regex
      scope: "recursive"       # 递归搜索后代元素文本
      action: "remove_table_and_following"  # 删除所在表格及后续元素
  # 边界检测：遇到这些样式时停止收集删除范围
  boundary_styles:
    - "1"
    - "2"
    - "3"
    - "Heading1"
    - "Heading2"
    - "Heading3"

# ---------------------------------------------------------------------
# 编码与兼容性配置
# ---------------------------------------------------------------------
encoding:
  # Windows 终端中文参数传递策略
  windows_terminal_fix:
    enabled: true
    approaches:
      - "set_env_vars"       # 设置 PYTHONIOENCODING=utf-8
      - "direct_api_call"    # 绕过 CLI 直接调用 JS/Python API
      - "arg_escaping"       # 参数转义处理
    env_vars:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
  # Node.js 编码处理
  node_encoding:
    stdout_encoding: "utf-8"
    argv_encoding: "utf-8"

# ---------------------------------------------------------------------
# 验证门禁
# ---------------------------------------------------------------------
validation_gates:
  - id: "template_exists"
    description: "模板文件存在且为 .docx 格式"
    severity: "blocking"
  - id: "design_data_valid"
    description: "design_data JSON 可解析且含 coverPage"
    severity: "blocking"
  - id: "paragraph_count"
    description: "输出段落数与模板差异 ≤ 20%"
    severity: "warning"
  - id: "heading_level_consistency"
    description: "标题层级无跨级（H1→H3 无 H2 过渡）"
    severity: "warning"
  - id: "hardcode_number_stripped"
    description: "H1-H8 标题无硬编码编号残留"
    severity: "warning"
  - id: "cover_fields_present"
    description: "封面标题/部门/日期已替换"
    severity: "warning"
  - id: "header_footer_preserved"
    description: "页眉页脚文件完整保留"
    severity: "warning"

# ---------------------------------------------------------------------
# 章节分类关键词配置
# 设计原则：所有章节识别关键词均通过本配置管理，代码中不硬编码
# 新增关键词只需在本节添加，无需修改 Python 代码
# ---------------------------------------------------------------------
chapter_classification:
  # 业务模块标题关键词（ch 标题命中这些关键词 → 归类为 business）
  business_module_title:
    - "模块设计说明"
    - "功能模块"
    - "业务模块"
    - "功能子模块"
  # 业务模块 H2 子节关键词（sections 标题命中这些关键词 → 归类为 business）
  business_module_h2:
    - "功能描述"
    - "界面"
    - "性能"
    - "输入项"
    - "输出项"
    - "接口"
    - "类图"
    - "顺序图"
    - "活动图"
    - "备注"
    - "功能职责"
    - "功能"
    - "输入"
    - "输出"
    - "参数"
    - "业务规则"
    - "业务逻辑"
    - "业务流程"
  # 概述类 ch 标题关键词
  overview_title:
    - "概述"
    - "项目概述"
    - "系统概述"
    - "引言"
    - "简介"
  # 设计约束类 ch 标题关键词
  constraint_title:
    - "设计约束"
    - "约束"
    - "限制条件"
    - "前提条件"
  # 组件列表类 ch 标题关键词
  component_list_title:
    - "组件列表"
    - "模块列表"
    - "组件汇总"
    - "模块清单"
  # 附录类 ch 标题关键词
  appendix_title:
    - "附录"
    - "附表"
    - "附件"

# ---------------------------------------------------------------------
# 模板 H2 标准子节别名映射
# 模板中的 H2 标题可能与 JSON section 标题不完全一致，通过别名匹配
# 新增别名只需在本节添加，无需修改 Python 代码
# ---------------------------------------------------------------------
template_h2_alias_map:
  "功能描述":
    - "模块职责"
    - "功能描述"
    - "模块划分"
  "输入项":
    - "接口边界"
    - "接口定义"
    - "参数说明"
  "输出项":
    - "接口边界"
    - "接口定义"
    - "参数说明"
  "接口":
    - "接口边界"
    - "接口定义"
    - "接口列表"
  "类图": []
  "顺序图": []
  "活动图": []
  "备注": []

# ---------------------------------------------------------------------
# 业务子模块识别配置
# 控制 requirement-analyzer.js 中 _extractModules 的识别范围
# ---------------------------------------------------------------------
business_submodule_detection:
  # 业务子模块的 Markdown 标题级别范围（H3=3, H4=4, H5=5）
  # 扩展范围可适配不同 PRD 格式（如 H3 级别的业务模块）
  min_level: 3
  max_level: 5
  # 内容最小长度阈值（字符数），低于此值不视为业务子模块
  min_content_length: 20
  # 截断长度：模块描述截取的最大字符数
  description_truncate_length: 80

# ---------------------------------------------------------------------
# design 管线 fallback 策略（v1.1 新增）
# 管线模式失败时的降级路径：先例脚本模式（precedent-script）
# 详细诊断与降级步骤见 TROUBLESHOOTING.md「design 模板锚点分类错位」章节
# ---------------------------------------------------------------------
pipeline_fallback:
  # 降级链：标准管线 → 锚点修复重试 → 先例脚本模式
  chain:
    - mode: "pipeline"
      description: "标准管线模式（本文件 stages 驱动）"
    - mode: "pipeline-retry"
      description: "按 TROUBLESHOOTING 诊断方法补登记锚点关键词/别名后重试"
    - mode: "precedent-script"
      description: "复制 scripts/ 下同构先例脚本为新需求脚本，调整数据源后全代码精准生成"
  # pipeline → precedent-script 的切换条件（重试耗尽后任一满足即切换）
  switch_conditions:
    - condition: "anchor_misplacement_detected"
      description: "产出 docx 存在章节内容错位/锚点分类错误，且产出判定为废弃"
    - condition: "retry_exhausted"
      description: "锚点配置修复重试次数耗尽仍错位"
    - condition: "blocking_gate_failed"
      description: "validation_gates 中 severity=blocking 的门禁项失败"
  max_retries: 1
  # 先例脚本模式参数（复制起点可通过环境变量覆盖，避免写死）
  precedent_script:
    registry_dir: "scripts"
    default_template_script: "gen_org_mgmt_design.py"
    template_script_env: "${ENV:BEMP_DOC_PRECEDENT_SCRIPT}"
    new_script_naming: "gen_<requirement>_design.py"
    header_note_required: true
    keep_as_precedent: true

# =====================================================================
# BEMP 概要设计 - 章节结构与编号配置
# ---------------------------------------------------------------------
# 用途：把模板中固定的章节标题、编号、缩进、占位文本等从代码中抽离
# 设计原则：
#   - 缺失字段时使用内置默认值
#   - 所有中文字符串集中在 YAML，代码按 key 引用
#   - 通用：可适配不同银行的概要设计模板
# =====================================================================

# 文档主章节（H1）映射：标题文本 + 期望父章序号（自动定位）
# 编号：动态计算（按 H1 出现顺序）
chapters:
  h1_titles:
    - "概述"
    - "系统概述"
    - "设计概述"
    - "系统总体框架"
    - "系统组件"
    - "模块复用分析"
    - "非功能性设计"
    - "系统集成"
    - "附录"

  # 各 H1 下的 H2 子标题（用于组件编号）
  # 例：系统组件下 H2 = "5.1 机构管理" / "5.2 机构管理员管理" / ...
  h2_children:
    系统总体框架:
      - "网络结构图"
      - "组件结构图"
      - "外部接口"
      - "组件汇总表"
    系统组件:
      # 动态生成：5.1 / 5.2 / 5.3 ...
      auto_numbered: true
      subsection_h3:
        - "功能描述"
        - "关键技术"
        - "提供的接口"
        - "需要的接口"
    非功能性设计:
      - "界面"
      - "性能"
      - "安全性"
      - "可靠性"
      - "易用性"
      - "可调试性"
      - "可移植性"
      - "可维护性"
    系统集成:
      - "部署图"
    附录:
      - "附录内容包含以下部分"

# 模板占位 H2（在系统组件章节中需要被替换）
template_placeholders:
  system_component:
    first: "组件1"           # 第一个组件占位标题
    last:  "组件N"           # 末尾组件占位标题

# 空章节兜底占位文本
empty_placeholders:
  chapter: "不涉及"
  subsection: "不涉及"
  uml: "待补充"

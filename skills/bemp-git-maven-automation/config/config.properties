# BEMP Git Maven 自动化构建配置
# 修改此文件后重新调用技能即可生效，无需重启IDE
# 环境变量可覆盖同名配置项

# ======== 常用配置（按需修改） ========

# 项目根目录（留空则从技能目录向上3级自动推断，一般无需修改）
# 示例：D:\code\QJ\BEMP5.0DEV
PROJECT_ROOT=

# 构建类型：full=全量构建 / incremental=增量构建
BUILD_TYPE=incremental

# Banks个性化工程构建目录（逗号分隔，留空则自动发现所有ext-*目录）
# 指定银行示例：ext-hnnxbank | 多银行：ext-hnnxbank,ext-hxbank
BANKS_BUILD_DIRS=ext-hnnxbank

# 是否自动构建依赖模块：true / false
BANKS_BUILD_DEPENDENCIES=true

# Maven内存参数（构建内存不足时可调大，编码参数由脚本自动追加）
MAVEN_OPTS=-Xmx2048m -XX:MaxMetaspaceSize=512m

# ======== 高级配置（一般无需修改） ========

# 跳过的目录（逗号分隔）
SKIP_DIRS=node_modules,target,.idea,log,logs

# 冲突处理方式：stop=停止 / warn=警告继续 / skip=跳过
CONFLICT_ACTION=stop

# 并行构建：true / false
PARALLEL_BUILD=false

# 并行线程数
BUILD_THREADS=4

# Git操作重试次数（网络抖动时自动重试）
GIT_RETRY_COUNT=3

# 生成构建报告：true / false
ENABLE_BUILD_REPORT=true

# 构建日志级别：verbose=全部输出 / normal=关键行 / quiet=仅摘要
BUILD_LOG_LEVEL=normal

# 目标目录被锁定时自动跳过clean：true / false
SKIP_CLEAN_ON_LOCK=true

# 构建顺序（逗号分隔，按Maven依赖关系排列）
# 修改此配置可适配不同的模块组织结构
BUILD_ORDER=bom,framework,adapter,banks,served

# 增量构建时跳过的文件后缀（逗号分隔，这些文件的变更不触发构建）
SKIP_BUILD_EXTENSIONS=.md,.txt,.gitignore,.gitattributes
